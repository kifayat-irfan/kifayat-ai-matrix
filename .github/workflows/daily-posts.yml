name: Daily AI Posts

on:
  schedule:
    # 6:00 UTC daily — generate and publish the day's 20 posts
    - cron: "0 6 * * *"
  workflow_dispatch: # manual trigger

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate today's 20 AI posts
        run: npm run gen:posts

      - name: Commit generated posts
        run: |
          git config user.name "kifayat-ai-matrix-bot"
          git config user.email "bot@kifayat-ai-matrix.app"
          git add src/app/posts public/covers
          if git diff --staged --quiet; then
            echo "No new posts to commit."
          else
            git commit -m "chore(posts): generate daily AI posts $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
